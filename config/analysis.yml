# =============================================================================
# analysis.yml
#
# Every analysis-defining choice for the employment meta-analysis. Scientific
# constants live here, not scattered through R, so a reviewer can see and change
# them in one place. This file is hashed into the analysis identifier, so the
# commit that pins these values provably predates the fits that use them.
#
# The logit scale is the working scale throughout. Proportions are produced by
# draw-wise back-transformation, never by transforming a summary.
#
# The prose justification for each choice is in docs/statistical_analysis_plan.md.
# Changing a value here without changing that document leaves the two
# disagreeing, and the plan is the authority.
# =============================================================================

seed: 20260805

inputs:
  reports:  {path: data/extraction_reports.csv,  required: true}
  cohorts:  {path: data/extraction_cohorts.csv,  required: true}
  arms:     {path: data/extraction_arms.csv,     required: true}
  outcomes: {path: data/extraction_outcomes.csv, required: true}
  rob:      {path: data/extraction_rob.csv,      required: false}
  manifest: {path: data/inclusion_manifest.csv,  required: true}
  # A report may describe more than one independently recruited cohort, which a
  # single cohort_id column on extraction_reports.csv cannot express. This table
  # is the authority for the report-to-cohort relation, and batches are formed
  # from its connected components so that every report bearing on one
  # result-selection decision is read together.
  report_cohort_map: {path: data/report_cohort_map.csv, required: false}
  # Field-level provenance for every value capable of moving a result into or
  # out of the primary pool, and the ledger the independent human verification
  # writes into.
  provenance:   {path: data/extraction_provenance.csv, required: false}
  # Batch id, prompt and model versions, extractor, timestamps, seeds and the
  # hashes of both the source PDFs and the produced shard. Frozen once a batch
  # is marked complete, so a row can be traced to the exact inputs that made it.
  batch_ledger: {path: data/batch_ledger.csv, required: false}

# --- provenance --------------------------------------------------------------
# Every output table carries this label so a number cannot be lifted from a CSV
# without the caveat travelling with it.
#
# It becomes `full` ONLY after all of: the governance gate closes (the search is
# complete and the universe frozen, SAP v0.2 ratified, PROSPERO amendment
# submitted; only the clean frozen commit is outstanding), the
# author-response cycle reaches its closure date, independent human verification
# of every pool-determining field is complete, final validation passes, and a
# clean tagged release pins data, code, config, prompts, environment and PDF
# hashes. Until then it says so.
sample_status: "DEFINITIVE EXTRACTION IN PROGRESS - NOT FOR INFERENCE"

# --- the primary prevalence pool ---------------------------------------------
# The gate is EMPLOYMENT-RELATED SELECTION, not parent study design. See
# docs/methods_deviations.md D9 and SAP section 2.1.
#
# Parent design is an unreliable proxy for the population being estimated. The
# pilot showed the error in both directions: an observational cohort recruited
# through a vocational placement was admitted, while the merged OPUS trial
# cohort was excluded despite having no employment-related recruitment
# criterion. A random-effects distribution cannot convert a rate conditioned on
# factors that determine employment into a marginal prevalence.
pool:
  # Only cohorts with no employment-related selection. `unclear` is admitted
  # solely in the named sensitivity analysis below; silence in a thin methods
  # section is `unclear`, never `none`.
  employment_selection: [none]
  arm_types: [cohort]
  ascertainment: [point_prevalence]
  # paid_any ONLY. paid_competitive and paid_sheltered_noncompetitive are
  # separate outcome families, not looser versions of the primary construct: a
  # competitive-only numerator answers a different question while keeping the
  # primary label. Likewise period_prevalence above.
  outcome_construct: [paid_any]
  diagnosis_groups: [fep, schizophrenia, psychosis_mixed]
  # Admitted when min_perc_qualifying_diagnosis is met. Subgroup extractability
  # is NOT an additional requirement: SAP section 7 as clarified on 12 August
  # 2026 (D13) makes the 50 per cent rule sufficient on its own for a whole
  # recruited cohort. `chr` is absent from both lists and excluded
  # unconditionally.
  #
  # Without this, carstairs_1992 could not contribute at all: barring
  # `smi_mixed` by label excluded the 241-patient hospital cohort that is 70 per
  # cent schizophrenia, and the diagnostically pure 169 could not substitute
  # because a nested subgroup is not a whole recruited cohort. That contradicted
  # the prespecified 50 per cent rule, so the rule wins and the label yields.
  #
  # Below 50 per cent, an extractable subgroup is retained for a separately
  # labelled subgroup analysis only. It never enters this pool, for the same
  # reason: a subgroup arm is not a whole recruited cohort.
  diagnosis_groups_conditional: [smi_mixed]
  min_perc_qualifying_diagnosis: 50
  denominator: n_outcome_observed
  # A trial-derived whole cohort must satisfy every safeguard. Each is a column
  # in extraction_arms.csv; the required value is given here so the rule lives
  # in configuration rather than in R.
  trial_safeguards:
    all_original_arms_included: ["yes", not_applicable]
    post_randomisation_selection: ["no", not_applicable]
    employment_targeted_intervention: ["no", not_applicable]
    common_construct_across_arms: ["yes", not_applicable]
    selective_reweighting: ["no", not_applicable]
  one_result_per_cohort: true
  # Applied in order when several results survive for one cohort at one horizon.
  # Proximity to the landmark comes FIRST because SAP section 4 defines the
  # estimate as "the reported timepoint closest to 12 months within the window";
  # the SAP section 5 order then breaks remaining ties.
  result_selection_order: [closest_to_landmark, largest_analysis_population, closest_construct, earliest_publication]

# --- follow-up horizons ------------------------------------------------------
# A landmark fixes the horizon so the pooled estimate has one meaning. Taking
# each cohort's longest follow-up would mix 12 months with 20 years and would
# select on which cohorts published long-term results. See SAP section 4.
#
# Bands are inclusive ranges, and 18 months falls in BOTH t12m and t24m. That
# overlap is resolved prospectively, before any count was seen: a result is
# assigned to the band whose landmark is nearest, and an exact tie goes to the
# LONGER horizon. So 18 months is t24m. Previously the first band listed simply
# won, which is an artefact of ordering rather than a rule.
horizons:
  primary: t12m
  tie_break: longer_horizon
  bands:
    t12m:  {label: "12 months",        landmark_months: 12,  min_months: 9,   max_months: 18}
    t24m:  {label: "24 months",        landmark_months: 24,  min_months: 18,  max_months: 30}
    t60m:  {label: "5 years",          landmark_months: 60,  min_months: 48,  max_months: 78}
    t120m: {label: "10 years or more", landmark_months: 120, min_months: 108, max_months: 100000}

# --- sparse data -------------------------------------------------------------
# Prespecified BEFORE any definitive count was seen, so that a thin pool is
# reported rather than negotiated. Counted in DISTINCT COHORTS, not result rows:
# ten results from one cohort are one cohort's worth of evidence.
#
# If a horizon falls below threshold the primary fit for that horizon stops.
# Extraction, the other horizons, the secondary estimands and the rest of the
# review continue, and no prespecified rule is relaxed.
sparse_data:
  min_cohorts_for_model: 2
  zero_cohorts: no_estimate
  one_cohort: descriptive_interval_only
  # A single cohort gets an exact binomial interval, labelled as one cohort's
  # observed proportion and explicitly NOT a meta-analysis.
  one_cohort_method: exact_binomial
  # At 2 to 9 cohorts the model is fitted but the half-normal prior on tau does
  # much of the work, so prior sensitivity is reported alongside, prominently.
  small_k_threshold: 10
  small_k_requires_prior_sensitivity: true

# --- moderators --------------------------------------------------------------
# Scaling is fixed here in clinical units and is NEVER recomputed from whichever
# cohorts are in a given fit. Recentring on the pilot and again on the full data
# would silently change what a coefficient means and what its prior implies.
#
# `nominal_contrast` anchors both the prior and any threshold. The fitted
# coefficient is per `unit`, so:
#   nominal_span       = diff(nominal_contrast) / unit
#   prior_beta_unit_sd = prior_beta_full_sd / nominal_span
moderators:
  horizon:
    label: "Follow-up (per doubling of months from 12)"
    kind: continuous
    tier: confirmatory
    unit: 1
    centre: 12
    transform: log2_months_over_12
    nominal_contrast: [0, 3]
  diagnosis_group:
    label: "Diagnosis group"
    kind: categorical
    tier: confirmatory
    reference: fep
  country_income_level:
    label: "Country income level"
    kind: categorical
    tier: confirmatory
    reference: high
  outcome_construct:
    label: "Employment construct"
    kind: categorical
    tier: confirmatory
    reference: paid_any
  mean_age:
    label: "Mean age (per 10 years)"
    kind: continuous
    tier: exploratory
    unit: 10
    centre: 30
    nominal_contrast: [25, 35]
  perc_female:
    label: "Female (per 10 percentage points)"
    kind: continuous
    tier: exploratory
    unit: 10
    centre: 40
    nominal_contrast: [30, 50]
  perc_post_secondary:
    label: "Post-secondary education (per 10 percentage points)"
    kind: continuous
    tier: exploratory
    unit: 10
    centre: 30
    nominal_contrast: [20, 50]
  perc_employed_baseline:
    label: "Employed at baseline (per 10 percentage points)"
    kind: continuous
    tier: exploratory
    unit: 10
    centre: 20
    nominal_contrast: [10, 40]
  region:
    label: "Region"
    kind: categorical
    tier: exploratory
    reference: europe_north
  setting:
    label: "Setting"
    kind: categorical
    tier: exploratory
    reference: eip
  # rob_overall is SUSPENDED, not deleted. It was listed as an exploratory
  # moderator, which means an overall risk-of-bias rating would enter an
  # analysis, but nothing anywhere defines how to derive one from JBI's nine
  # items, RoB 2's five domains or ROBINS-I's seven. Inventing a rule now (for
  # instance banding a count of JBI "no" answers) would manufacture a composite
  # with no standing in any of the three instruments, and the three scales are
  # explicitly never collapsed onto a shared scale.
  #
  # It is reinstated only if the authorship group prespecifies a per-instrument
  # derivation rule, which then goes here and in the SAP. See
  # docs/methods_deviations.md D10.
  # rob_overall:
  #   label: "Risk of bias"
  #   kind: categorical
  #   tier: exploratory
  #   reference: low

# Cochrane Handbook chapter 10: meta-regression should generally not be
# considered with fewer than ten studies, with roughly ten per characteristic.
# A moderator below threshold is reported with status "not reported" and blank
# estimates, so its absence is visible rather than silent.
reportability:
  min_cohorts_continuous: 10
  min_cohorts_per_level: 10

# --- priors ------------------------------------------------------------------
# Intercept: plogis(-1.1) = 0.25, mid-range of the 10 to 40 per cent reported in
# this field. SD 0.8 implies a 95 per cent prior interval on the pooled
# proportion of 0.065 to 0.615, so nothing plausible is excluded and the prior
# cannot by itself produce the estimate. normal(0, 10) on a logit is NOT
# uninformative for a proportion: it piles mass at 0 and 1.
#
# Ajnakina et al.'s 32.5 per cent is a prior predictive plausibility anchor
# ONLY, never a prior mean: its 74 studies overlap this review's search window,
# so using it informatively would double-count the same primary studies.
#
# tau: half-normal(0.5). Median 0.34 implies true cohort proportions of 0.15 to
# 0.39 at a pooled 0.25; 95 per cent of the prior lies below 0.98. Ajnakina
# reported I-squared near 96 per cent, so a prior concentrated below 0.2 would
# be indefensible. Rover et al. (2021).
#
# 23 September 2026, after the provisional fit. The claim above that the prior
# "cannot by itself produce the estimate" did not hold at t12m. Both t12m
# cohorts lay above the prior's central mass: one (0.63) above the prior's
# 95 per cent upper bound on the pooled proportion (0.615 analytically, 0.619
# in the prior predictive simulation), the other (0.50) near its 91st
# percentile. The posterior median (0.53) sat below the pooled raw proportion
# (0.60), drawn toward the prior, so the prior did shape the estimate. No prior
# value below is changed, because the priors were prespecified; prior
# sensitivity (tables/prior_sensitivity.csv) and a prior against posterior
# table (tables/prior_posterior_overlap.csv) are reported alongside.
priors:
  primary:
    intercept_mean: -1.1
    intercept_sd: 0.8
    tau_sd: 0.5
    beta_full_sd: 0.5
    treatment_lor_sd: 0.7
  grid:
    intercept_mean: [-1.4, -1.1, -0.8]
    intercept_sd:   [0.5, 0.8, 1.5]
    tau_sd:         [0.25, 0.5, 1.0]
    beta_full_sd:   [0.25, 0.5, 1.0]
  weak:
    intercept_mean: 0.0
    intercept_sd: 5.0
    tau_sd: 2.0
    beta_full_sd: 2.0
    treatment_lor_sd: 2.0

# --- prior predictive check --------------------------------------------------
# PRESPECIFIED. The requirement is COVERAGE, not agreement: a proportion has no
# null of zero, so a directional criterion would be meaningless. A criterion
# chosen after seeing the prior predictive is unfalsifiable, so a failure here
# is reported as a failure and the priors are revised in a dated amendment.
prior_predictive:
  anchors_p: [0.10, 0.325, 0.45]
  anchor_interval_prob: 0.95
  new_cohort_interval: [0.01, 0.90]
  new_cohort_min_mass: 0.90
  obs_median_range: [0.10, 0.45]
  obs_max_mass_above: {threshold: 0.80, max_mass: 0.05}
  # Denominators the check is run across, in addition to the observed ones, so
  # the priors are shown to behave for small cohorts and zero-event cases.
  extra_denominators: [20, 50, 100]

# --- reporting ---------------------------------------------------------------
# Estimation is primary (Dienes 2021). A decision is an additional statement
# about a posterior, never a substitute for reporting it.
#
# One headline interval. Reporting both an equal-tailed and a highest-density
# interval adds complexity without changing the conclusion; the HDI is computed
# only where the posterior is visibly asymmetric, and then on the proportion
# draws, because the HDI is not invariant under back-transformation.
#
# No ROPE on the pooled proportion: no defensible threshold for an acceptable
# employment rate exists, and inventing one to obtain a categorical verdict is
# not justified. lib_config.R fails at load if this is set true.
reporting:
  primary_interval: equal_tailed
  interval_prob: 0.95
  hdi_when_asymmetric: true
  rope_on_pooled_proportion: false
  # Populated ONLY if an external clinical or policy rationale is written into
  # the statistical analysis plan first. Empty means none is reported.
  directional_thresholds: []
  slope_sesoi_grid: {from: 0.05, to: 0.50, by: 0.05}

# --- frequentist comparison --------------------------------------------------
# A DIAGNOSTIC, not a gate. Different likelihood approximations and priors can
# legitimately differ, and there is no theorem requiring tau_bayes >= tau_freq.
# No agreement tolerance is imposed on real data and no run fails on a
# discrepancy; equivalence is tested on simulated data where the expected
# behaviour is known.
#
# `model` is deliberately absent: it is not relevant for measure PLO, warns as
# such, and returns identical estimates for UM.FS and UM.RS.
frequentist:
  measure: PLO
  method: ML
  approximate_secondary: {measure: PLO, method: REML, test: knha}
  treat_as_gate: false

# --- sampling ----------------------------------------------------------------
sampling:
  chains: 4
  iter_warmup: 2000
  iter_sampling: 3000
  adapt_delta: 0.95
  max_treedepth: 12
  adapt_delta_ladder: [0.95, 0.99, 0.999]

# Applied to posterior fits only. Prior predictive draws are not put through
# posterior convergence gates: they are checked against the criteria above.
diagnostics:
  max_rhat: 1.01
  min_ess_bulk: 400
  min_ess_tail: 400
  max_divergent: 0
  max_treedepth_hits: 0
  min_ebfmi: 0.2

# --- simulation --------------------------------------------------------------
# Coverage validation, not a smoke test. Benchmark cost before raising
# n_replicates: the runner records elapsed time per scenario.
simulation:
  n_replicates: 200
  report_monte_carlo_interval: true
  scenarios:
    - {name: central,        p: 0.30, tau: 0.45, k: 40, size: pilot_resample}
    - {name: low_prevalence, p: 0.10, tau: 0.45, k: 40, size: pilot_resample}
    - {name: high_tau,       p: 0.30, tau: 0.90, k: 40, size: pilot_resample}
    - {name: zero_tau,       p: 0.30, tau: 0.00, k: 40, size: pilot_resample}
    - {name: small_k,        p: 0.30, tau: 0.45, k: 12, size: pilot_resample}
    - {name: size_imbalance, p: 0.30, tau: 0.45, k: 40, size: extreme_imbalance}
    - {name: zero_events,    p: 0.03, tau: 0.45, k: 40, size: small_only}
  # Bias in the pooled proportion is gated; tau coverage is REPORTED, not gated,
  # because the half-normal deliberately regularises tau at small k and
  # undercoverage there is the prior working as designed.
  max_abs_bias_proportion: 0.02
  gate_tau_coverage: false

sensitivity:
  # IMPLEMENTED. Each entry overrides one key of `pool:` and is executed by
  # build_primary_pool(); R/01_validate_data.R reports each resulting cohort set
  # against the primary. These are the two analyses SAP section 2.1 names, and
  # they are here as executable specifications because a configuration flag that
  # no code reads is not a sensitivity analysis.
  implemented:
    unclear_selection_included:
      label: "Cohorts with unclear employment selection admitted"
      pool_override: {employment_selection: [none, unclear]}
    trial_derived_excluded:
      label: "All trial-derived cohorts excluded"
      pool_override: {exclude_parent_designs: [rct, cluster_rct, non_randomised_trial]}

  # IMPLEMENTED IN THE RUNNER, not as pool overrides. They are kept out of
  # `implemented` above because build_sensitivity_pools() treats every entry
  # there as a pool override. This block is documentation: R/00_run_all.R runs
  # them at every horizon where D11.3 permits the model (2 or more cohorts).
  implemented_model_sensitivities:
    # One hyperparameter at a time over priors.grid, the others held at
    # priors.primary, plus the whole priors.weak set. Run wherever
    # sparse_data.small_k_requires_prior_sensitivity applies (2 to 9 cohorts).
    # beta_full_sd is not varied: it scales moderator slopes and the fitted
    # prevalence model has none. tables/prior_sensitivity.csv
    prior_grid: true
    # priorsense::powerscale_sensitivity on each primary fit, for the pooled
    # logit and tau. tables/priorsense_powerscale.csv
    priorsense: true
    # Unobserved alive-and-eligible participants all unemployed (worst) or all
    # employed (best), denominator n_alive_eligible as in prop_unobserved;
    # cohorts without it keep their observed counts, and the number bounded is
    # reported. Rows missing_outcome_worst/best in
    # tables/sensitivity_by_horizon.csv
    missing_outcome_bounds: true

  # DEFERRED, WITH A REASON. No code runs these, with one exception stated in
  # its own entry: leave_one_cohort_out runs POST HOC under deviation D15, and
  # stays listed here because its prespecified form, predictive assessment at
  # k >= 5, is still deferred. Each reason is a property of the evidence base
  # now, not a judgement about the analysis, and is revisited when the cohort
  # count changes.
  deferred_with_reason:
    leave_one_cohort_out: "prespecified as deferred: uninformative at k = 2 or 3, where dropping a cohort leaves one or two; implement when any horizon reaches k >= 5. Since 23 September 2026 implemented POST HOC for k >= 3 (deviation D15), after prior-data conflict and posterior predictive misfit in the provisional fit; at k = 2 the two cohort-level exact binomial intervals are reported instead of a refit. tables/leave_one_cohort_out.csv and diagnostics/ppc_loco.csv; does not replace the prespecified primary"
    attrition_moderator: "a moderator, and no moderator is reportable below 10 cohorts under `reportability`"
    all_moderators: "not reportable below 10 cohorts under `reportability`; moderator_slopes.csv records each as not reported"
    intervention_model: "SAP section 10.2; a separate synthesis of randomised arms, not a sensitivity of the prevalence estimate"
    simulation_study: "coverage validation under `simulation`; not yet run, and its small_k scenario is k = 12, above every current horizon"
    i_squared: "not meaningful below 10 cohorts; tau and the new-cohort interval are reported instead"
    funnel_and_egger: "small-study tests have no power below 10 cohorts (Cochrane Handbook chapter 13)"

  # NOT sensitivity analyses, recorded here to prevent them being mistaken for
  # some. Period prevalence, cumulative attainment, competitive-only and
  # sheltered-only results are SEPARATE OUTCOME FAMILIES with their own
  # estimands and their own syntheses. Adding them to the primary pool would
  # change what is being estimated, not test the robustness of the estimate.
  separate_outcome_families_not_sensitivities:
    - period_prevalence
    - any_time_during_followup
    - paid_competitive
    - paid_sheltered_noncompetitive
    - paid_or_education_or_training

# Predictive assessment leaves out whole cohorts. Observation-level LOO is
# misleading when each observation carries a near-unique random effect and the
# target is prediction for a new cohort.
cross_validation:
  method: leave_one_cohort_out
  k_fold_groups: cohort_id
